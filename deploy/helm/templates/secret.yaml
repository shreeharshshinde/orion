{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orion.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels: {{- include "orion.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ORION_DATABASE_DSN: {{ required "database.dsn is required when database.existingSecret is not set" .Values.database.dsn | quote }}
  ORION_REDIS_ADDR: {{ .Values.redis.addr | quote }}
  ORION_REDIS_PASSWORD: {{ .Values.redis.password | default "" | quote }}
{{- end }}
